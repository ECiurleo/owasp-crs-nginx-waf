name: Docker Image CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          DATE=$(date -u +'%Y%m%d')
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build ./waf \
            --file ./waf/Dockerfile \
            --tag "${{ steps.meta.outputs.image }}:latest" \
            --tag "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.date }}"

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ steps.meta.outputs.image }}:latest"
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.date }}"

      - name: Create GitHub Release
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.meta.outputs.date }}" \
            --title "WAF Docker Image ${{ steps.meta.outputs.date }}" \
            --notes "Weekly WAF Docker image build.

          Docker image:
          ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.date }}

          Latest:
          ${{ steps.meta.outputs.image }}:latest"
